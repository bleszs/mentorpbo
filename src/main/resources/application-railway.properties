# ============================================================
# PROFIL RAILWAY — override application.properties
# Aktif saat Dockerfile ENTRYPOINT set -Dspring.profiles.active=railway
# ============================================================

# Supabase PostgreSQL — Session Pooler (port 5432, IPv4, supports DDL/Hibernate)
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.zkuxzgpaocdzruldzdqj
spring.datasource.password=jejakilmu123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# H2 Console nonaktif
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# PROXY HEADERS — wajib agar {baseUrl} OAuth2 resolve ke https://
# Railway menggunakan reverse proxy; tanpa ini redirect_uri
# akan menjadi http:// dan Google menolak.
# ==============================================================
server.forward-headers-strategy=framework
