# ============================================================
# PROFIL RAILWAY — override application.properties
# Aktif saat Dockerfile ENTRYPOINT set -Dspring.profiles.active=railway
# ============================================================

# PostgreSQL dari Railway Plugin (env var otomatis dari plugin)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console nonaktif di Railway (pakai PostgreSQL)
spring.h2.console.enabled=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
