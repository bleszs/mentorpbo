# ==============================================================
# PLATFORM MENTORING AKADEMIK - Konfigurasi Aplikasi
# ==============================================================
# Deskripsi: File konfigurasi utama Spring Boot untuk sistem
#            mentoring akademik terintegrasi (Sekolah & Kampus).
# ==============================================================

spring.application.name=Platform Mentoring Akademik

# --- Konfigurasi Server ---
server.port=8080

# --- Konfigurasi H2 Database (File-Based) ---
# Menggunakan mode file agar data tersimpan permanen di disk.
# Data tetap ada meskipun aplikasi di-restart.
spring.datasource.url=jdbc:h2:file:./data/mentoring_akademik_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=mentorpbo2024

# Aktifkan H2 Console untuk inspeksi database via browser
# Akses di: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Konfigurasi JPA / Hibernate ---
# Strategi pembuatan skema: update (otomatis sesuaikan tabel dengan entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Buka koneksi database secara lazy agar efisien
spring.jpa.open-in-view=true

# --- Konfigurasi Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Nonaktifkan cache saat development agar perubahan template langsung terlihat
spring.thymeleaf.cache=false

# --- Konfigurasi Logging ---
logging.level.com.mentorpbo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==============================================================
# KONFIGURASI EMAIL (Gmail SMTP)
# Ganti dengan email dan App Password Gmail Anda:
# 1. Buka https://myaccount.google.com/security
# 2. Aktifkan 2-Step Verification
# 3. Buat App Password (pilih "Mail" + "Windows Computer")
# 4. Masukkan 16-karakter App Password di bawah
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gregorian.sinaga@gmail.com
spring.mail.password=GANTI_DENGAN_APP_PASSWORD_GMAIL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email tujuan notifikasi admin
app.admin.email=gregorian.sinaga@gmail.com

# ==============================================================
# KONFIGURASI GOOGLE OAUTH2 LOGIN
# Langkah setup:
# 1. Buka https://console.cloud.google.com
# 2. Buat project baru → APIs & Services → Credentials
# 3. Create OAuth 2.0 Client ID (Web Application)
# 4. Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
# 5. Salin Client ID dan Client Secret ke bawah
# ==============================================================
spring.security.oauth2.client.registration.google.client-id=GANTI_DENGAN_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=GANTI_DENGAN_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Nonaktifkan auto-konfigurasi OAuth2 jika credentials belum diisi
# (ubah ke false setelah mengisi client-id dan client-secret di atas)
spring.autoconfigure.exclude=
