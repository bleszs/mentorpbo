# ==============================================================
# PLATFORM MENTORING AKADEMIK - Konfigurasi Aplikasi
# ==============================================================
# Deskripsi: File konfigurasi utama Spring Boot untuk sistem
#            mentoring akademik terintegrasi (Sekolah & Kampus).
# ==============================================================

spring.application.name=Platform Mentoring Akademik

# --- Konfigurasi Server ---
server.port=8080

# --- Konfigurasi H2 Database (File-Based, Persisten) ---
# Mode file: data tersimpan permanen di folder ./data/ dan tetap ada setelah restart.
# DataSeeder otomatis melewati proses seeding jika data sudah ada (idempoten).
spring.datasource.url=jdbc:h2:file:./data/mentoring_akademik_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=mentorpbo2024

# Aktifkan H2 Console untuk inspeksi database via browser
# Akses di: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Konfigurasi JPA / Hibernate ---
# update: sesuaikan tabel dengan entity secara otomatis, TANPA menghapus data lama.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Buka koneksi database secara lazy agar efisien
spring.jpa.open-in-view=true

# DevTools: matikan override datasource otomatis (agar file-based H2 tidak diganti in-memory)
spring.devtools.add-properties=false
spring.devtools.restart.enabled=true

# --- Konfigurasi Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Nonaktifkan cache saat development agar perubahan template langsung terlihat
spring.thymeleaf.cache=false

# --- Konfigurasi Logging ---
logging.level.com.mentorpbo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

