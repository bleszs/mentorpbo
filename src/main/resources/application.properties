# ==============================================================
# KONFIGURASI GOOGLE OAUTH2 LOGIN
# ==============================================================
# LANGKAH SETUP (wajib sebelum mengaktifkan):
#
# 1. Buka: https://console.cloud.google.com
# 2. Pilih atau buat project baru
# 3. Klik "APIs & Services" → "Credentials"
# 4. Klik "+ CREATE CREDENTIALS" → "OAuth client ID"
# 5. Application type: Web application
# 6. Tambahkan Authorized redirect URI:
#    http://localhost:8080/login/oauth2/code/google
# 7. Klik "Create" → salin Client ID dan Client Secret
# 8. Isi di bawah ini, lalu set app.google.oauth2.enabled=true
#
# CATATAN: Client ID yang valid SELALU berakhir dengan:
#   .apps.googleusercontent.com
#   Contoh: 123456789-abc...xyz.apps.googleusercontent.com
# ==============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Set ke true HANYA setelah client-id dan client-secret diisi dengan nilai asli
app.google.oauth2.enabled=true
